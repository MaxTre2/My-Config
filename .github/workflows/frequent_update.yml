name: Auto-Update VPN Configs

on:
  schedule:
    # Каждые 9 минут - используем */9, но GitHub Actions имеет ограничение минимум 5 минут
    # ВАЖНО: GitHub Actions может иметь задержки при частых запусках [citation:3][citation:6]
    - cron: "*/9 * * * *"
  # Возможность ручного запуска
  workflow_dispatch:

jobs:
  update-configs:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # кэширование зависимостей для ускорения
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔄 Run config updater
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: python main.py
      
      - name: ✅ Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 📤 Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add README.md ByPassVpnLera.txt githubmirror/*.txt
          git commit -m "🤖 Автообновление конфигов $(date '+%Y-%m-%d %H:%M')"
          git push
