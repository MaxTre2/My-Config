name: Auto-Update VPN Configs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Увеличено до 90 минут (как в скрипте)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt

      - name: Make xray executable
        run: |
          chmod +x source/xray
          echo "✅ Права на source/xray установлены"

      - name: Run config updater
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          XRAY_BIN: "source/xray"
        run: |
          cd source && python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Нет изменений для коммита"
          else
            git commit -m "Автообновление конфигов $(date +'%Y-%m-%d %H:%M')"
            git push --force
            echo "✅ Изменения отправлены"
          fi
