name: Auto-Update VPN Configs

on:
  schedule:
    # Каждые 9 минут
    - cron: "*/9 * * * *"
  workflow_dispatch:

jobs:
  update-configs:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_TOKEN }}
          
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "source/requirements.txt" ]; then
            echo "✅ Installing from requirements.txt"
            pip install -r source/requirements.txt
          else
            echo "✅ Installing packages directly"
            pip install PyGithub requests urllib3
          fi
      
      - name: 🔄 Run config updater
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          if [ -f "source/main.py" ]; then
            echo "✅ Running main.py from source folder"
            cd source && python main.py
          elif [ -f "main.py" ]; then
            echo "✅ Running main.py from root"
            python main.py
          else
            echo "❌ main.py not found!"
            echo "Searching for main.py:"
            find . -name "main.py" -type f
            exit 1
          fi
