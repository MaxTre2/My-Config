name: Auto-Update VPN Configs

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-configs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub requests urllib3
          echo "✅ Dependencies installed"
      
      - name: Debug - Show files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== FILES IN ROOT ==="
          ls -la
          echo "=== FILES IN .GITHUB ==="
          ls -la .github/ 2>/dev/null || echo "No .github folder"
          echo "=== FILES IN SOURCE ==="
          ls -la source/ 2>/dev/null || echo "No source folder"
          echo "=== SEARCHING FOR main.py ==="
          find . -name "main.py" -type f
      
      - name: Debug - Show Python path
        run: |
          which python
          python --version
      
      - name: Run config updater
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          set -e  # остановить при ошибке
          set -x  # показать каждую команду
          
          # Ищем main.py
          if [ -f "source/main.py" ]; then
            echo "✅ Found main.py in source folder"
            python source/main.py
          elif [ -f "main.py" ]; then
            echo "✅ Found main.py in root"
            python main.py
          else
            echo "❌ main.py not found anywhere!"
            exit 1
          fi
          
          echo "✅ Script completed"
      
      - name: Debug - After script
        if: always()  # запускается даже при ошибке
        run: |
          echo "=== GIT STATUS AFTER SCRIPT ==="
          git status
          echo "=== CHANGED FILES ==="
          git diff --name-only
      
      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Добавляем файлы (игнорируем ошибки, если файлов нет)
          git add README.md 2>/dev/null || true
          git add ByPassVpnLera.txt 2>/dev/null || true
          git add githubmirror/*.txt 2>/dev/null || true
          
          # Проверяем, есть ли изменения
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            echo "📤 Committing changes..."
            git commit -m "🤖 Auto-update configs $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Changes pushed"
          fi
