name: Auto-Update VPN Configs

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-configs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install PyGithub requests urllib3
      
      - name: Find and run main.py
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          echo "Looking for main.py..."
          if [ -f "source/main.py" ]; then
            echo "Found in source/ folder"
            python source/main.py
          elif [ -f "main.py" ]; then
            echo "Found in root folder"
            python main.py
          else
            echo "Searching entire repository..."
            find . -name "main.py" -type f
            echo "❌ main.py not found!"
            exit 1
          fi
      
      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add README.md ByPassVpnLera.txt githubmirror/*.txt 2>/dev/null || true
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update configs $(date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi
