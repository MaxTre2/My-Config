name: Auto-Update VPN Configs

on:
  schedule:
    - cron: "0 */6 * * *"  # Каждые 6 часов
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔧 Make xray executable
        run: |
          if [ -f "xray" ]; then
            chmod +x xray
            echo "✅ xray найден"
          else
            echo "⚠️ xray не найден"
          fi

      - name: 🔄 Run config updater
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          if [ -f "source/main.py" ]; then
            cd source && python main.py
          elif [ -f "main.py" ]; then
            python main.py
          else
            echo "❌ main.py not found!"
            exit 1
          fi

      - name: 📤 Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add githubmirror/
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Нет изменений для коммита"
          else
            git commit -m "Автообновление конфигов $(date +'%Y-%m-%d %H:%M')"
            git push --force
            echo "✅ Изменения отправлены"
          fi
