name: Auto-Update VPN Configs

on:
  schedule:
    # Каждые 3 часа (в 0 минут)
    - cron: "0 */3 * * *"
  workflow_dispatch:
  # Убираем push, чтобы не создавать лишние запуски

jobs:
  update-configs:
    runs-on: ubuntu-latest
    # Добавляем блокировку, чтобы одновременно выполнялся только один workflow
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_TOKEN }}
          fetch-depth: 0
          
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub requests urllib3
      
      - name: 🔄 Run config updater
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          if [ -f "source/main.py" ]; then
            echo "✅ Found main.py in source folder"
            python source/main.py
          elif [ -f "main.py" ]; then
            echo "✅ Found main.py in root"
            python main.py
          else
            echo "❌ main.py not found!"
            exit 1
          fi
      
      - name: 📤 Commit and push changes
        run: |
          # Настройка Git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Добавляем файлы
          git add README.md 2>/dev/null || true
          git add ByPassVpnLera.txt 2>/dev/null || true
          git add githubmirror/*.txt 2>/dev/null || true
          
          # Проверяем, есть ли изменения
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          # Создаем уникальный коммит с timestamp
          TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
          git commit -m "🤖 Auto-update configs [${TIMESTAMP}]"
          
          # Максимальное количество попыток
          MAX_RETRIES=5
          RETRY=0
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            # Пробуем запушить
            if git push; then
              echo "✅ Push successful"
              exit 0
            else
              RETRY=$((RETRY+1))
              echo "⚠️ Push failed (attempt $RETRY/$MAX_RETRIES). Pulling latest changes..."
              
              # Сохраняем изменения и обновляем
              git fetch origin main
              git stash
              git rebase origin/main || git merge origin/main
              git stash pop || true
              
              # Обновляем коммит
              git add .
              git commit --amend --no-edit
              
              # Ждем перед следующей попыткой
              sleep 5
            fi
          done
          
          echo "❌ Failed to push after $MAX_RETRIES attempts"
          exit 1
